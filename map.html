<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEA Amuwa DC - Feeder & GIS Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .top-bar {
      background: #0054a6; color: #ffffff; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 3px solid #dc2626;
    }
    .top-bar h1 { margin: 0; font-size: 16px; }
    .back-link {
      background: #ffffff; color: #0054a6; text-decoration: none;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 700;
    }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>NEA Amuwa DC — Feeder & GIS Map</h1>
    <a class="back-link" href="index.html">Portal</a>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>
  <script>
    const KMZ_FILENAME = "AMUWADC.kmz";

    const streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 20,
      attribution: "&copy; OpenStreetMap"
    });

    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 20, attribution: "&copy; Esri" }
    );

    const map = L.map("map", {
      center: [27.58, 83.41],
      zoom: 13,
      layers: [streetLayer],
      preferCanvas: true
    });

    const layerControl = L.control.layers({
      "Street Map": streetLayer,
      "Satellite": satelliteLayer
    }).addTo(map);

    const kmz = L.kmzLayer().addTo(map);
    kmz.on("load", function (e) {
      layerControl.addOverlay(e.layer, e.name || "Network KMZ");
      if (e.layer.getBounds && e.layer.getBounds().isValid()) {
        map.fitBounds(e.layer.getBounds());
      }
    });
    kmz.load(KMZ_FILENAME);
  </script>
</body>
</html>
